<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D12 responsive review</title><style>body{margin:0;padding:16px;background:#deded5;font:13px system-ui;color:#243320}header{display:flex;gap:8px;align-items:center;margin-bottom:12px}button{padding:8px 12px;border:1px solid #b5bca9;border-radius:5px;background:#f8f9f0;cursor:pointer}iframe{display:block;width:390px;height:600px;border:0;background:#f2f1e9;box-shadow:0 4px 30px #24332018}#label{margin-right:8px;font-weight:600}</style><header><span id="label">390 px</span><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1200">1200 px</button></header><iframe id="reviewFrame" src="./?review=ui-20261002-2" title="Responsive simulator preview"></iframe><script>const frame=document.getElementById('reviewFrame');function fit(){frame.style.height=Math.max(600,frame.contentDocument.querySelector('main').getBoundingClientRect().height+24)+'px';}frame.addEventListener('load',()=>{fit();new ResizeObserver(fit).observe(frame.contentDocument.querySelector('main'));});document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';frame.style.height='600px';document.getElementById('label').textContent=button.dataset.width+' px';requestAnimationFrame(fit);}));</script></html>
